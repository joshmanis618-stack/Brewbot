# Brewbot Mosquitto MQTT broker config
# For production: set allow_anonymous false and configure passwords via
#   mosquitto_passwd -c /mosquitto/config/passwd <username>

listener 1883
allow_anonymous true

# WebSocket listener — lets browser-based MQTT clients connect directly
listener 9001
protocol websockets
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type all
