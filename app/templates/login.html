<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Brewbot</title>
  <script>(function(){document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('brewbot_theme')||'light');})();</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/brewbot.css">
</head>
<body class="bg-body d-flex align-items-center justify-content-center" style="min-height:100vh;">
<div class="card shadow" style="width:100%;max-width:380px;">
  <div class="card-body p-4">
    <div class="text-center mb-4">
      <i class="bi bi-thermometer-half text-warning" style="font-size:2.5rem;"></i>
      <h4 class="mt-2 mb-0 fw-bold">Brewbot</h4>
      <small class="text-muted">Sign in to continue</small>
    </div>
    {% if error %}
    <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-brew w-100">Sign In</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
