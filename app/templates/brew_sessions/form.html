{% extends "base.html" %}
{% block title %}New Brew Session — Brewbot{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <nav aria-label="breadcrumb"><ol class="breadcrumb mb-1 small">
      <li class="breadcrumb-item"><a href="/brew-sessions">Brew Sessions</a></li>
      <li class="breadcrumb-item active">New Session</li>
    </ol></nav>
    <h1>New Brew Session</h1>
  </div>
</div>

<div class="row">
  <div class="col-lg-5">
    <div class="card">
      <div class="card-header fw-semibold">Session Details</div>
      <div class="card-body">
        <form method="post" action="/brew-sessions/create">
          <div class="mb-3">
            <label class="form-label">Recipe <span class="text-danger">*</span></label>
            <select name="recipe_id" class="form-select" required>
              <option value="">— Select a recipe —</option>
              {% for r in recipes %}
              <option value="{{ r.id }}">{{ r.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Brew Date</label>
            <input type="date" name="brew_date" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Notes</label>
            <textarea name="notes" class="form-control" rows="4"
                      placeholder="Water chemistry, adjustments, …"></textarea>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" name="deduct_inventory" value="1"
                   class="form-check-input" id="deductInvCheck">
            <label class="form-check-label" for="deductInvCheck">
              Deduct ingredients from inventory
            </label>
            <div class="form-text">Reduces stock quantities for all recipe ingredients immediately.</div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-brew">
              <i class="bi bi-plus-lg me-1"></i>Start Session
            </button>
            <a href="/brew-sessions" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
