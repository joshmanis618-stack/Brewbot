<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Brewbot — Create Admin Account</title>
  <script>(function(){document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('brewbot_theme')||'light');})();</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/brewbot.css">
</head>
<body class="bg-body d-flex align-items-center justify-content-center" style="min-height:100vh;">
<div class="card shadow" style="width:100%;max-width:420px;">
  <div class="card-body p-4">
    <div class="text-center mb-4">
      <i class="bi bi-thermometer-half text-warning" style="font-size:2.5rem;"></i>
      <h4 class="mt-2 mb-0 fw-bold">Welcome to Brewbot</h4>
      <small class="text-muted">No accounts exist yet. Create your administrator account to get started.</small>
    </div>
    {% if error %}
    <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}
    <form method="post" action="/setup" id="setup-form">
      <div class="mb-3">
        <label class="form-label">Username <span class="text-danger">*</span></label>
        <input type="text" name="username" class="form-control" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email <span class="text-muted small">(optional)</span></label>
        <input type="email" name="email" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Password <span class="text-danger">*</span></label>
        <input type="password" name="password" id="password" class="form-control" required>
      </div>
      <div class="mb-4">
        <label class="form-label">Confirm Password <span class="text-danger">*</span></label>
        <input type="password" id="confirm_password" class="form-control" required>
        <div id="pw-mismatch" class="form-text text-danger d-none">Passwords do not match.</div>
      </div>
      <button type="submit" class="btn btn-brew w-100">Create Account</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('setup-form').addEventListener('submit', function(e) {
  var pw = document.getElementById('password').value;
  var cpw = document.getElementById('confirm_password').value;
  var msg = document.getElementById('pw-mismatch');
  if (pw !== cpw) {
    e.preventDefault();
    msg.classList.remove('d-none');
  } else {
    msg.classList.add('d-none');
  }
});
document.getElementById('confirm_password').addEventListener('input', function() {
  var pw = document.getElementById('password').value;
  var msg = document.getElementById('pw-mismatch');
  if (this.value && this.value !== pw) {
    msg.classList.remove('d-none');
  } else {
    msg.classList.add('d-none');
  }
});
</script>
</body>
</html>
