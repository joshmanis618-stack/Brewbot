<tr data-row-type="fermentable">
  <td>
    <select name="fermentable_id_{{ index }}" class="form-select form-select-sm" required>
      <option value="">— Select —</option>
      {% for f in fermentables %}
      <option value="{{ f.id }}">{{ f.name }} ({{ f.type }})</option>
      {% endfor %}
    </select>
  </td>
  <td>
    <input name="amount_kg_{{ index }}" type="number" step="0.01" min="0"
           class="form-control form-control-sm" placeholder="kg" required>
  </td>
  <td class="text-center">
    <input name="add_after_boil_{{ index }}" type="checkbox" class="form-check-input" value="1">
  </td>
  <td>
    <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)">
      <i class="bi bi-x"></i>
    </button>
  </td>
</tr>
