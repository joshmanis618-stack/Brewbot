<tr data-row-type="yeast">
  <td>
    <select name="yeast_id_{{ index }}" class="form-select form-select-sm ingredient-select" required
            onchange="recalculate()">
      <option value="">— Select —</option>
      {% for y in yeasts %}
      <option value="{{ y.id }}"
              data-attenuation="{{ y.attenuation_pct }}">
        {{ y.name }}{% if y.lab %} — {{ y.lab }}{% endif %}
      </option>
      {% endfor %}
    </select>
  </td>
  <td>
    <input name="yeast_amount_{{ index }}" type="number" step="0.5" min="0"
           class="form-control form-control-sm" value="1" placeholder="packets">
  </td>
  <td>
    <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)">
      <i class="bi bi-x"></i>
    </button>
  </td>
</tr>
