<tr data-row-type="hop">
  <td>
    <select name="hop_id_{{ index }}" class="form-select form-select-sm" required>
      <option value="">— Select —</option>
      {% for h in hops %}
      <option value="{{ h.id }}">{{ h.name }} ({{ h.alpha_pct }}% AA)</option>
      {% endfor %}
    </select>
  </td>
  <td>
    <input name="hop_amount_g_{{ index }}" type="number" step="0.1" min="0"
           class="form-control form-control-sm" placeholder="g" required>
  </td>
  <td>
    <input name="time_min_{{ index }}" type="number" min="0"
           class="form-control form-control-sm" value="60">
  </td>
  <td>
    <select name="hop_use_{{ index }}" class="form-select form-select-sm">
      <option>Boil</option>
      <option>Dry Hop</option>
      <option>First Wort</option>
      <option>Aroma</option>
      <option>Mash</option>
    </select>
  </td>
  <td>
    <select name="hop_form_{{ index }}" class="form-select form-select-sm">
      <option>Pellet</option>
      <option>Plug</option>
      <option>Leaf</option>
    </select>
  </td>
  <td>
    <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)">
      <i class="bi bi-x"></i>
    </button>
  </td>
</tr>
