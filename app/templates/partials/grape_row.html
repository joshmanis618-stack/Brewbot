<tr data-row-type="grape">
  <td>
    <select name="grape_id_{{ index }}" class="form-select form-select-sm" required>
      <option value="">— Select —</option>
      {% for g in grapes %}
      <option value="{{ g.id }}" data-color="{{ g.color or '' }}">
        {{ g.name }}{% if g.color %} ({{ g.color|title }}){% endif %}{% if g.origin %} — {{ g.origin }}{% endif %}
      </option>
      {% endfor %}
    </select>
  </td>
  <td>
    <input name="grape_amount_kg_{{ index }}" type="number" step="0.1" min="0"
           class="form-control form-control-sm" placeholder="kg">
  </td>
  <td>
    <input name="grape_pct_{{ index }}" type="number" step="0.1" min="0" max="100"
           class="form-control form-control-sm" placeholder="%">
  </td>
  <td>
    <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)">
      <i class="bi bi-x"></i>
    </button>
  </td>
</tr>
