<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Brewbot{% endblock %}</title>
  <script>(function(){document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('brewbot_theme')||'light');})();</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/brewbot.css">
</head>
<body class="bg-body">

<nav class="navbar navbar-expand-lg navbar-dark navbar-brewbot sticky-top shadow-sm">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-thermometer-half me-1"></i>Brewbot
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1">
        <li class="nav-item">
          <a class="nav-link rounded px-3 {% if page == 'dashboard' %}active{% endif %}" href="/">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link rounded px-3 {% if page == 'recipes' %}active{% endif %}" href="/recipes">
            <i class="bi bi-journal-text me-1"></i>Recipes
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link rounded px-3 {% if page == 'equipment' %}active{% endif %}" href="/equipment">
            <i class="bi bi-tools me-1"></i>Equipment
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link rounded px-3 {% if page == 'ingredients' %}active{% endif %}" href="/ingredients">
            <i class="bi bi-basket me-1"></i>Ingredients
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link rounded px-3 {% if page == 'devices' %}active{% endif %}" href="/devices">
            <i class="bi bi-cpu me-1"></i>Controller
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link rounded px-3 {% if page == 'brew_sessions' %}active{% endif %}" href="/brew-sessions">
            <i class="bi bi-clipboard-data me-1"></i>Brew Sessions
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link rounded px-3 {% if page == 'brew_programs' %}active{% endif %}" href="/brew-programs">
            <i class="bi bi-list-ol me-1"></i>Brew Programs
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link rounded px-3 {% if page == 'converter' %}active{% endif %}" href="/converter">
            <i class="bi bi-calculator me-1"></i>Converter
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link rounded px-3 {% if page == 'settings' %}active{% endif %}" href="/settings">
            <i class="bi bi-gear me-1"></i>Settings
          </a>
        </li>
      </ul>
      <button id="dark-toggle" class="btn btn-outline-light btn-sm me-1"
              onclick="toggleDark()" title="Toggle dark mode">
        <i class="bi bi-moon-fill" id="dark-icon"></i>
      </button>
      <button class="btn btn-outline-light btn-sm me-2"
              data-bs-toggle="offcanvas" data-bs-target="#helpOffcanvas" aria-label="Help">
        <i class="bi bi-question-circle"></i>
      </button>
      <a href="/docs" class="btn btn-outline-secondary btn-sm" target="_blank">
        <i class="bi bi-code-slash me-1"></i>API
      </a>
    </div>
  </div>
</nav>

<main class="container-fluid px-4 py-4" style="max-width: 1400px;">
  {% block content %}{% endblock %}
</main>

<div class="offcanvas offcanvas-end" tabindex="-1" id="helpOffcanvas" aria-labelledby="helpOffcanvasLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="helpOffcanvasLabel"><i class="bi bi-question-circle me-2"></i>Help</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    {% block page_help %}
    <p class="text-muted">No help available for this page.</p>
    {% endblock %}
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
<script src="/static/js/brewbot.js"></script>
<script>
function toggleDark() {
  const next = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-bs-theme', next);
  localStorage.setItem('brewbot_theme', next);
  document.getElementById('dark-icon').className = next === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
}
(function(){
  const t = localStorage.getItem('brewbot_theme') || 'light';
  const icon = document.getElementById('dark-icon');
  if (icon) icon.className = t === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
