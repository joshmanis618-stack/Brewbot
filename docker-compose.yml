services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://brewbot:brewbot@db:5432/brewbot
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - SESSION_SECRET=REPLACE_WITH_STRONG_SECRET
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  caddy:
    build: ./caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_logs:/var/log/caddy
    depends_on:
      - api

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: brewbot
      POSTGRES_PASSWORD: brewbot
      POSTGRES_DB: brewbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewbot -d brewbot"]
      interval: 5s
      retries: 5

  mosquitto:
    build: ./mosquitto
    volumes:
      - mosquitto_data:/mosquitto/data
    ports:
      - "1883:1883"    # MQTT (controller hardware on LAN connects here)
      - "9001:9001"    # MQTT over WebSocket (browser clients)

volumes:
  postgres_data:
  mosquitto_data:
  caddy_data:
  caddy_logs:
